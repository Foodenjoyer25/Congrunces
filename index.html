<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congruences Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            background: #f9f9f9;
            border-radius: 8px;
            overflow: hidden;
        }

        .results-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .results-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
        }

        .results-table tr:last-child td {
            border-bottom: none;
        }

        .results-table tr:nth-child(even) {
            background: #f5f5f5;
        }

        .results-table tr:hover {
            background: #e8e8e8;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Congruences Calculator</h1>
        <p class="subtitle">Calculate modular exponentiation sequences</p>
        
        <div class="info-box">
            This calculator finds the sequence of n<sup>x</sup> mod z for coprime numbers n and z, continuing until the result returns to 1.
        </div>

        <div class="input-group">
            <label for="number1">Number 1 (n):</label>
            <input type="number" id="number1" placeholder="Enter first number" min="1">
        </div>

        <div class="input-group">
            <label for="number2">Number 2 (z - modulus):</label>
            <input type="number" id="number2" placeholder="Enter second number" min="1">
        </div>

        <button onclick="calculate()">Calculate</button>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <h2>Results:</h2>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Expression</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function gcd(p, q) {
            while (q !== 0) {
                [p, q] = [q, p % q];
            }
            return p;
        }

        function isCoprime(x, y) {
            return gcd(x, y) === 1;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('results').style.display = 'none';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function calculate() {
            hideError();

            const n = parseInt(document.getElementById('number1').value);
            const z = parseInt(document.getElementById('number2').value);

            // Validation
            if (isNaN(n) || isNaN(z)) {
                showError('Please enter valid numbers for both fields.');
                return;
            }

            if (n <= 0 || z <= 0) {
                showError('Please enter positive numbers greater than 0.');
                return;
            }

            if (!isCoprime(n, z)) {
                showError(`Numbers ${n} and ${z} are not coprime. GCD(${n}, ${z}) = ${gcd(n, z)}. Please enter coprime numbers.`);
                return;
            }

            // Calculate sequence
            const resultsBody = document.getElementById('resultsBody');
            resultsBody.innerHTML = '';

            let x = 1;
            let i = 0;

            // Prevent infinite loops (safety limit)
            const maxIterations = 10000;
            let iterations = 0;

            do {
                const d = Math.pow(n, x);
                i = d % z;
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${n}<sup>${x}</sup> mod ${z}</td>
                    <td>${i}</td>
                `;
                resultsBody.appendChild(row);

                x++;
                iterations++;

                if (iterations > maxIterations) {
                    showError('Maximum iterations reached. The sequence may not converge to 1.');
                    return;
                }
            } while (i !== 1);

            document.getElementById('results').style.display = 'block';
        }

        // Allow Enter key to trigger calculation
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        calculate();
                    }
                });
            });
        });
    </script>
</body>
</html>
